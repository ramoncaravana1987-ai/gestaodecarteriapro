<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Carteira Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Cabeçalho e Controles -->
        <header class="flex flex-wrap justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <h1 class="text-xl font-bold text-emerald-400">Gestão de Carteira</h1>
            
            <div class="flex items-center gap-4">
                <!-- Status de Nuvem -->
                <div id="autosaveBadge" class="flex items-center gap-2 bg-emerald-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors">
                    <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
                    <span id="autosaveStatus">NUVEM</span>
                </div>

                <!-- Botão de Importar Backup -->
                <label class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition">
                    Importar Backup (.json)
                    <input type="file" id="fileInput" accept=".json" class="hidden" onchange="importarDados(event)">
                </label>
            </div>
        </header>

        <!-- Área Principal de Exibição -->
        <main class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold">Resumo do Sistema</h2>
                <span id="infoClientes" class="text-sm text-slate-400">Carregando registros...</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-sm">
                            <th class="p-3">Fantasia / Razão</th>
                            <th class="p-3">Cidade</th>
                            <th class="p-3">Contato</th>
                            <th class="p-3">WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaClientesBody" class="divide-y divide-slate-700 text-sm">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // URL DO GOOGLE APPS SCRIPT JÁ CONFIGURADA:
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxI1qXcX3gvFogFxV-xHD3LF6Ha3V1HU0gjoSjjd9dZ6YBBmF-Zeas2FeTt3XM9RcmJYw/exec';

        let dadosApp = { clientes: [], produtos: [] };

        // Inicialização
        window.addEventListener('DOMContentLoaded', async () => {
            const salvoLocal = localStorage.getItem('controle_clientes_db');
            if (salvoLocal) {
                try {
                    dadosApp = JSON.parse(salvoLocal);
                    atualizarInterface();
                } catch(e) { console.error(e); }
            }
            
            // Tenta buscar da nuvem se houver URL válida
            if (GOOGLE_SCRIPT_URL) {
                try {
                    const resposta = await fetch(GOOGLE_SCRIPT_URL);
                    const dadosNuvem = await resposta.json();
                    if (dadosNuvem && dadosNuvem.clientes && dadosNuvem.clientes.length > 0) {
                        dadosApp = dadosNuvem;
                        localStorage.setItem('controle_clientes_db', JSON.stringify(dadosApp));
                        atualizarInterface();
                    }
                } catch(err) {
                    console.log('Usando dados locais (offline ou erro na nuvem).');
                }
            }
        });

function importarDados(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const conteudo = JSON.parse(e.target.result);
            
            // Trata diferentes formatos e variações de chaves do backup
            if (Array.isArray(conteudo)) {
                dadosApp = { clientes: conteudo, produtos: [] };
            } else if (conteudo.clientes) {
                dadosApp = conteudo;
            } else if (conteudo.Clientes) {
                dadosApp = { clientes: conteudo.Clientes, produtos: conteudo.produtos || conteudo.Produtos || [] };
            } else {
                // Se encontrar qualquer array no objeto, assume que são os clientes
                const chaveArray = Object.keys(conteudo).find(k => Array.isArray(conteudo[k]));
                dadosApp = { clientes: chaveArray ? conteudo[chaveArray] : [], produtos: [] };
            }
            
            salvarDados();
            atualizarInterface();
            alert(`Sucesso! ${dadosApp.clientes.length} clientes carregados na tela.`);
        } catch (err) {
            alert('Erro ao ler o arquivo JSON: ' + err.message);
        }
    };
    reader.readAsText(file);
}

        // Função de Salvamento Automático (Local + Nuvem via Formulário Oculto)
        function salvarDados() {
            localStorage.setItem('controle_clientes_db', JSON.stringify(dadosApp));
            
            const badge = document.getElementById('autosaveBadge');
            const status = document.getElementById('autosaveStatus');
            badge.classList.replace('bg-emerald-600', 'bg-amber-500');
            status.textContent = 'SALVANDO';

            if (GOOGLE_SCRIPT_URL) {
                let form = document.getElementById('hiddenFormSync');
                if (!form) {
                    form = document.createElement('form');
                    form.id = 'hiddenFormSync';
                    form.action = GOOGLE_SCRIPT_URL;
                    form.method = 'POST';
                    form.target = 'hiddenIframeSync';
                    form.style.display = 'none';
                    
                    let iframe = document.createElement('iframe');
                    iframe.name = 'hiddenIframeSync';
                    iframe.style.display = 'none';
                    
                    let input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'payload';
                    input.id = 'hiddenPayloadInput';
                    
                    form.appendChild(input);
                    form.appendChild(iframe);
                    document.body.appendChild(form);
                }
                
                document.getElementById('hiddenPayloadInput').value = JSON.stringify(dadosApp);
                form.submit();
                
                setTimeout(() => {
                    badge.classList.replace('bg-amber-500', 'bg-emerald-600');
                    status.textContent = 'NUVEM';
                }, 1200);
            }
        }

        // Renderização simples na tela para validação
        function atualizarInterface() {
            const tbody = document.getElementById('tabelaClientesBody');
            const info = document.getElementById('infoClientes');
            tbody.innerHTML = '';
            
            const total = dadosApp.clientes ? dadosApp.clientes.length : 0;
            info.textContent = `${total} clientes cadastrados`;

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">Nenhum dado encontrado. Importe seu backup.</td></tr>`;
                return;
            }

            // Exibe os primeiros 50 para teste rápido de performance
            dadosApp.clientes.slice(0, 50).forEach(c => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-medium text-white">${c.fantasia || c.nome || '---'}</td>
                    <td class="p-3 text-slate-300">${c.cidade || '---'}</td>
                    <td class="p-3 text-slate-300">${c.contato || '---'}</td>
                    <td class="p-3 text-slate-300">${c.whatsapp || '---'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
